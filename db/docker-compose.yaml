version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: mysql_ephemeral
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db
    ports:
      - "3306:3306"
    volumes:
      # https://stackoverflow.com/questions/19158810/docker-mount-volumes-as-readonly
      - ./employee-db-schema.sql:/docker-entrypoint-initdb.d/employee-db-schema.sql:ro
    restart: unless-stopped
